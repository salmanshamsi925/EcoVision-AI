<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#102B47"/>
      <stop offset="100%" stop-color="#040C16"/>
    </radialGradient>
    
    <!-- Planetary Atmosphere Glow -->
    <linearGradient id="orbitGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20C5FF"/>
      <stop offset="50%" stop-color="#168BFF"/>
      <stop offset="100%" stop-color="#22D3A0"/>
    </linearGradient>

    <!-- Eco Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3A0"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#20C5FF"/>
    </linearGradient>

    <!-- Filter for vibrant node glow -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle App Badge Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#20C5FF" stroke-opacity="0.4" stroke-width="1.8"/>

  <!-- Outer Pulsing Orbit Ring -->
  <circle cx="32" cy="32" r="23" stroke="url(#orbitGlow)" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="3.5 2"/>

  <!-- Digital Planetary Sphere -->
  <circle cx="32" cy="32" r="18" fill="#0A223C"/>
  <circle cx="32" cy="32" r="18" fill="url(#orbitGlow)" fill-opacity="0.2"/>
  <circle cx="32" cy="32" r="18" stroke="url(#orbitGlow)" stroke-width="2"/>

  <!-- Stylized Continents / Vegetation Landmass -->
  <path d="M21 27C23 23 27 21 31 22C33 23 36 20 38 21.5C41 23 43 26 42 29.5C40.5 32 41 35 39 37.5C37 39.5 33 42 29 41C26 40 24 37 22 35C20 33 19 30 21 27Z" fill="url(#emeraldGrad)" opacity="0.95"/>
  <path d="M25 30C27 28 31 29 32 32C32.5 34 30.5 36 28.5 35.5C26.5 34.5 24.5 32.5 25 30Z" fill="#20C5FF" opacity="0.7"/>

  <!-- Precision Digital Rings (Globe Longitude & Latitude) -->
  <ellipse cx="32" cy="32" rx="18" ry="7" fill="none" stroke="#20C5FF" stroke-width="1.2" stroke-opacity="0.75"/>
  <line x1="32" y1="14" x2="32" y2="50" stroke="#20C5FF" stroke-width="1.2" stroke-opacity="0.75"/>

  <!-- AI Climate Intelligence Satellite Node (Cyan Spark) -->
  <circle cx="46" cy="18" r="4.2" fill="#20C5FF" filter="url(#nodeGlow)"/>
  <circle cx="46" cy="18" r="2" fill="#FFFFFF"/>
  <line x1="42" y1="22" x2="38" y2="26" stroke="#20C5FF" stroke-width="1.2" stroke-opacity="0.8" stroke-dasharray="1.5 1.5"/>

  <!-- South Asia / Pakistan Region Focus Pin -->
  <circle cx="33" cy="26" r="2" fill="#22D3A0" filter="url(#nodeGlow)"/>
  <circle cx="33" cy="26" r="0.9" fill="#FFFFFF"/>
</svg>
